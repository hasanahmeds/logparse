[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "logparse-curriculum"
version = "1.0.0"
description = "Streaming server-log analytics CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
logparse = "logparse.cli:main"

[tool.setuptools.packages.find]
include = ["logparse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
